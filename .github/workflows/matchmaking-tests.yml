name: Python tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run backend tests
        run: python -m unittest discover -s tests -p 'test_matchmaking.py' -v
      - name: Check syntax
        run: python -m compileall -q matchmaking.py matchmaking_ui.py community_ui.py
